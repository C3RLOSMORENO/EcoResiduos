name: Compilar y Publicar APK Android

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Tipo de incremento si no especificas etiqueta manual'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'
      release_tag:
        description: 'Etiqueta manual (ej. v1.2.0). Dejar en blanco para calcular automáticamente'
        required: false
        default: ''
      release_title:
        description: 'Título de la versión (opcional)'
        required: false
        default: ''
      create_release:
        description: 'Publicar en la sección de Releases de GitHub para descarga pública'
        required: true
        type: boolean
        default: true
      is_prerelease:
        description: 'Marcar como versión preliminar (pre-release)'
        required: false
        type: boolean
        default: false

  push:
    tags:
      - 'v*'
    branches:
      - main
      - 'feature/**'
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK (Release)
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ''
      BUILD_NUMBER: ''
      FULL_VERSION: ''
      date: ''
      TAG: ''
      TITLE: ''

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Aceptar licencias de Android SDK
        run: |
          yes | sdkmanager --licenses || true

      - name: Obtener dependencias de Flutter
        run: |
          cd app
          flutter pub get

      - name: Calcular versión semántica y número de compilación
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_BUMP: ${{ inputs.version_bump }}
          INPUT_TITLE: ${{ inputs.release_title }}
        run: |
          PUBSPEC_RAW=$(grep '^version:' app/pubspec.yaml | sed 's/version: //' | tr -d ' ' | tr -d '\r')
          PUBSPEC_VER=$(echo "$PUBSPEC_RAW" | cut -d'+' -f1)
          PUBSPEC_BUILD=$(echo "$PUBSPEC_RAW" | cut -d'+' -f2)
          if ! [[ "$PUBSPEC_BUILD" =~ ^[0-9]+$ ]]; then PUBSPEC_BUILD=1; fi

          # Obtener todas las versiones publicadas (tags git + releases de GitHub) en formato X.Y.Z
          TAGS_GIT=$(git tag -l 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)
          TAGS_GH=$(gh release list --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)
          ALL_VERSIONS=$(printf "%s\n%s\n" "$TAGS_GIT" "$TAGS_GH" | sort -uV | sed '/^$/d')
          LATEST_PUBLISHED=$(echo "$ALL_VERSIONS" | tail -n 1)

          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION_NAME=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          elif [ -n "$INPUT_TAG" ]; then
            VERSION_NAME=$(echo "$INPUT_TAG" | sed 's/^v//')
          elif [ -z "$LATEST_PUBLISHED" ]; then
            VERSION_NAME="$PUBSPEC_VER"
          else
            # Si pubspec.yaml tiene una versión mayor que la última publicada y aún no existe, se respeta pubspec.yaml.
            # Si la versión de pubspec.yaml ya fue publicada (ej. 1.0.0), se incrementa automáticamente desde la última publicada.
            HIGHEST=$(printf "%s\n%s\n" "$LATEST_PUBLISHED" "$PUBSPEC_VER" | sort -V | tail -n 1)
            ALREADY_EXISTS=$(echo "$ALL_VERSIONS" | grep -Fx "$PUBSPEC_VER" || true)

            if [ "$HIGHEST" = "$PUBSPEC_VER" ] && [ -z "$ALREADY_EXISTS" ]; then
              VERSION_NAME="$PUBSPEC_VER"
            else
              IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_PUBLISHED"
              BUMP="${INPUT_BUMP:-patch}"
              case "$BUMP" in
                major)
                  MAJOR=$((MAJOR + 1))
                  MINOR=0
                  PATCH=0
                  ;;
                minor)
                  MINOR=$((MINOR + 1))
                  PATCH=0
                  ;;
                *)
                  PATCH=$((PATCH + 1))
                  ;;
              esac
              VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi

          # El buildNumber (versionCode en Android) siempre crece en cada ejecución para permitir actualizar sin desinstalar
          BUILD_NUMBER=$((PUBSPEC_BUILD + GITHUB_RUN_NUMBER))
          FULL_VERSION="${VERSION_NAME}+${BUILD_NUMBER}"
          TAG="v${VERSION_NAME}"

          if [ -n "$INPUT_TITLE" ]; then
            TITLE="$INPUT_TITLE"
          else
            TITLE="EcoResiduos $TAG"
          fi

          echo "Última versión publicada: ${LATEST_PUBLISHED:-ninguna}"
          echo "Nueva versión calculada:  $FULL_VERSION ($TAG)"

          echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "TITLE=$TITLE" >> $GITHUB_ENV
          echo "date=$(date +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_ENV

      - name: Ejecutar pruebas unitarias de Flutter
        run: |
          cd app
          flutter test

      - name: Compilar APK en modo Release
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m'"
        run: |
          cd app
          flutter build apk --release --build-name="${{ env.VERSION_NAME }}" --build-number="${{ env.BUILD_NUMBER }}"

      - name: Preparar archivos APK para descarga
        run: |
          APK_DIR="app/build/app/outputs/flutter-apk"
          cp "$APK_DIR/app-release.apk" "$APK_DIR/EcoResiduos.apk"
          cp "$APK_DIR/app-release.apk" "$APK_DIR/EcoResiduos-v${{ env.VERSION_NAME }}.apk"
          ls -la "$APK_DIR"

      - name: Guardar APK como artefacto de GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: EcoResiduos-v${{ env.VERSION_NAME }}-APK
          path: |
            app/build/app/outputs/flutter-apk/EcoResiduos.apk
            app/build/app/outputs/flutter-apk/EcoResiduos-v${{ env.VERSION_NAME }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release en GitHub para descarga pública
        uses: softprops/action-gh-release@v2
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          github.ref == 'refs/heads/main' ||
          (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.TAG }}
          name: ${{ env.TITLE }}
          draft: false
          prerelease: ${{ inputs.is_prerelease || false }}
          generate_release_notes: true
          body: |
            ## Aplicación Móvil EcoResiduos (Android)

            ¡La versión de la aplicación está lista para descargar e instalar en dispositivos Android!

            ### ⬇️ Enlaces de Descarga Directa
            - **[Descargar EcoResiduos.apk (Recomendado)](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/EcoResiduos.apk)**
            - **[Descargar EcoResiduos-v${{ env.VERSION_NAME }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/EcoResiduos-v${{ env.VERSION_NAME }}.apk)**

            ---

            ### ℹ️ Información de Compilación
            - **Versión:** `${{ env.VERSION_NAME }}` (Build `${{ env.BUILD_NUMBER }}`)
            - **Fecha de compilación:** `${{ env.date }}`
            - **Commit:** `${{ github.sha }}`

            ---

            ### Instrucciones de Instalación
            1. Haz clic en **EcoResiduos.apk** desde tu navegador en el celular Android para descargarlo.
            2. Abre el archivo descargado.
            3. Si Android muestra una advertencia de seguridad (*"Por seguridad, el teléfono no tiene permitido instalar apps desconocidas de esta fuente"*):
               - Toca en **Ajustes / Configuración**.
               - Activa el permiso **"Permitir desde esta fuente"**.
               - Regresa y presiona **Instalar**.
            4. ¡Listo! Abre **EcoResiduos** e inicia sesión o regístrate.
          files: |
            app/build/app/outputs/flutter-apk/EcoResiduos.apk
            app/build/app/outputs/flutter-apk/EcoResiduos-v${{ env.VERSION_NAME }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
